      <section>

        <!-- ── 1. O QUE SÃO ─────────────────────────────────── -->
        <div class="card" id="o-que-sao">
          <h2>1. O que são Padrões de Projeto?</h2>

          <p>
            Padrões de Projeto (<em>Design Patterns</em>) são <strong>soluções reutilizáveis para
            problemas recorrentes</strong> no desenvolvimento de software orientado a objetos.
            Eles não são código pronto para copiar e colar, mas sim <em>receitas</em> ou
            <em>modelos conceituais</em> que descrevem como organizar classes e objetos para
            resolver um problema de forma elegante.
          </p>
          
          <h3>Por que usar padrões?</h3>
          <u
          <ul>
            ><strong>Código mais fácil de manter</strong> — quem lê o código reconhece a estrutura e entende mais rápido a intenção do desenvolvedor.</l/li>
            ><strong>Vocabulário comum</strong> — dizer "aqui usei um Observer" comunica a estrutura inteira sem precisar desenhar tudo do zero.</l/li>
            ><strong>Menor acoplamento</strong> — os padrões promovem que partes do sistema se conheçam o mínimo necessário, facilitando mudanças.</l/li>
            ><strong>Reuso de boas soluções</strong> — são fruto de experiência acumulada de dezenas de projetos reais; você não precisa "reinventar a roda".</li>
          </ul>

          <div class="antes-depois">
            <div class="antes">
              <h4>❌ Sem padrão</h4>
              <p>
                Código espalhado, classes com múltiplas responsabilidades, criação de objetos
                distribuída por todo o sistema, difícil de testar e modificar.
              </p>
            </div>
            <div class="depois">
              <h4>✅ Com padrão</h4>
              <p>
                Responsabilidades bem definidas, pontos de extensão claros, código previsível
                e testável, comunicação facilitada entre a equipe.
              </p>
            </div>
          </div>

          <div class="callout">
            <strong>Atenção:</strong> padrões são ferramentas, não receitas obrigatórias. Aplicar
            um padrão onde ele não é necessário aumenta a complexidade sem benefício. Aprenda
            a <em>reconhecer o problema</em> que cada padrão resolve.
          </div>
        </div>

        <!-- ── 2. ORIGEM ─────────────────────────────────────── -->
        <div class="card" id="origem">
          <h2>2. Origem — o "Gang of Four"</h2>

          <p>
            O termo vem do livro <strong><em>Design Patterns: Elements of Reusable
            Object-Oriented Software</em></strong>, publicado em 1994 pelos quatro autores
            Erich Gamma, Richard Helm, Ralph Johnson e John Vlissides — apelidados de
            <em>Gang of Four</em> (GoF), ou "Gangue dos Quatro".
          </p>

          <div class="timeline">
            <div class="timeline-item">
              <div class="timeline-ano">Década de 1970</div>
              <p>O arquiteto Christopher Alexander publica o primeiro catálogo de padrões, voltado para construção civil — inspiração direta para os padrões de software.</p>
            </div>
            <div class="timeline-item">
              <div class="timeline-ano">1987</div>
              <p>Kent Beck e Ward Cunningham apresentam os primeiros padrões para software em Smalltalk na conferência OOPSLA.</p>
            </div>
            <div class="timeline-item">
              <div class="timeline-ano">1994</div>
              <p>Gamma, Helm, Johnson e Vlissides publicam o livro GoF com 23 padrões catalogados para linguagens orientadas a objetos.</p>
            </div>
            <div class="timeline-item">
              <div class="timeline-ano">Hoje</div>
              <p>Os 23 padrões GoF são referência e fazem parte de frameworks modernos como Spring, Angular e React.</p>
            </div>
          </div>

          <div class="note">
            O livro GoF foi escrito com exemplos em C++ e Smalltalk, mas os padrões se aplicam
            a qualquer linguagem orientada a objetos — inclusive JavaScript.
          </div>

          <p style="font-size:.9rem;margin-top:.3rem;">
            Próximo passo: veja o <a href="#categorias">agrupamento em categorias</a> para entender
            como os 23 padrões se organizam.
          </p>
        </div>

        <!-- ── 3. CATEGORIAS ─────────────────────────────────── -->
        <div class="card" id="categorias">
          <h2>3. As 3 categorias dos padrões GoF</h2>

          <p>
            Os 23 padrões estão organizados em três grandes grupos, conforme o tipo de
            problema que resolvem:
          </p>

          <div class="cat-grid">
            <div class="cat-card cat-card--criacional">
              <h3>Criacionais</h3>
              <p>
                Tratam <strong>como objetos são criados</strong>. Permitem que o código não
                dependa diretamente de qual classe concreta está sendo instanciada.
              </p>
              <u
              <ul>
                >Singleton</l/li>
                >Factory Method</l/li>
                >Abstract Factory</l/li>
                >Builder</l/li>
                >Prototype</li>
              </ul>
            </div>

            <div class="cat-card cat-card--estrutural">
              <h3>Estruturais</h3>
              <p>
                Tratam <strong>como classes e objetos se combinam</strong> para formar
                estruturas maiores e mais flexíveis.
              </p>
              <u
              <ul>
                >Adapter</l/li>
                >Bridge</l/li>
                >Composite</l/li>
                >Decorator</l/li>
                >Facade</l/li>
                >Flyweight</l/li>
                >Proxy</li>
              </ul>
            </div>

            <div class="cat-card cat-card--comportamental">
              <h3>Comportamentais</h3>
              <p>
                Tratam <strong>como objetos se comunicam</strong> e distribuem
                responsabilidades entre si.
              </p>
              <u
              <ul>
                >Observer</l/li>
                >Strategy</l/li>
                >Template Method</l/li>
                >Command</l/li>
                >Iterator</l/li>
                >State</l/li>
                >Chain of Responsibility</l/li>
                >Mediator</l/li>
                >Memento</l/li>
                >Visitor</l/li>
                >Interpreter</li>
              </ul>
            </div>
          </div>

          <div class="anotacao">
            <p style="margin-top:0;"><strong>Como memorizar as categorias:</strong></p>
            <dl>
              <dt>Criacional → "Como nasce?"</dt>
              <dd>Encapsula e controla a forma de criar objetos, reduzindo dependências do de>new</code>.</dd>
              <dt>Estrutural → "Como se encaixa?"</dt>
              <dd>Define composições de classes e objetos para montar estruturas mais complexas com flexibilidade.</dd>
              <dt>Comportamental → "Como conversa?"</dt>
              <dd>Organiza a troca de mensagens e a distribuição de responsabilidades entre objetos em tempo de execução.</dd>
            </dl>
          </div>

          <p style="font-size:.9rem;margin-top:.3rem;">
            Próximo passo: veja o <a href="#catalogo">catálogo completo dos 23 padrões</a> e
            identifique quais pertencem a cada categoria.
          </p>
        </div>

        <!-- ── 4. CATÁLOGO COMPLETO ──────────────────────────── -->
        <div class="card" id="catalogo">
          <h2>4. Catálogo dos 23 padrões</h2>
          <p>
            A tabela a seguir resume todos os padrões GoF descrevendo o problema que cada um resolve.
          </p>

          <table class="tabela-padroes">
            <thead>
              <tr>
                <th>Categoria</th>
                <th>Padrão</th>
                <th>Problema que resolve</th>
              </tr>

              <tr><td><span class="badge badge--c">Criacional</span></td><td class="nome-padrao">Factory Method</td><td>Deixar que subclasses decidam qual objeto concreto criar.</td></tr>
              <tr><td><span class="badge badge--c">Criacional</span></td><td class="nome-padrao">Abstract Factory</td><td>Criar famílias de objetos relacionados sem especificar suas classes concretas.</td></tr>
              <tr><td><span class="badge badge--c">Criacional</span></td><td class="nome-padrao">Builder</td><td>Construir objetos complexos passo a passo, separando construção de representação.</td></tr>
              <tr><td><span class="badge badge--c">Criacional</span></td><td class="nome-padrao">Prototype</td><td>Criar novos objetos copiando (clonando) um existente.</td></tr>
              <tr><td><span class="badge badge--e">Estrutural</span></td><td class="nome-padrao">Adapter</td><td>Fazer duas interfaces incompatíveis trabalharem juntas.</td></tr>
              <tr><td><span class="badge badge--e">Estrutural</span></td><td class="nome-padrao">Bridge</td><td>Separar abstração de implementação para que ambas possam variar independentemente.</td></tr>
              <tr><td><span class="badge badge--e">Estrutural</span></td><td class="nome-padrao">Composite</td><td>Tratar objetos individuais e coleções de objetos de forma uniforme.</td></tr>
              <tr><td><span class="badge badge--e">Estrutural</span></td><td class="nome-padrao">Decorator</td><td>Adicionar comportamentos a objetos dinamicamente sem alterar a classe.</td></tr>
              <tr><td><span class="badge badge--e">Estrutural</span></td><td class="nome-padrao">Facade</td><td>Prover uma interface simplificada para um subsistema complexo.</td></tr>
              <tr><td><span class="badge badge--e">Estrutural</span></td><td class="nome-padrao">Flyweight</td><td>Compartilhar objetos para suportar grandes quantidades com uso eficiente de memória.</td></tr>

              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Strategy</td><td>Definir uma família de algoritmos e torná-los intercambiáveis.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Template Method</td><td>Definir o esqueleto de um algoritmo na superclasse, deixando passos para subclasses.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Command</td><td>Encapsular uma requisição como objeto, permitindo desfazer, enfileirar e registrar ações.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Iterator</td><td>Percorrer elementos de uma coleção sem expor sua estrutura interna.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">State</td><td>Alterar o comportamento de um objeto quando seu estado interno muda.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Chain of Responsibility</td><td>Passar uma requisição por uma cadeia de processadores até que um a trate.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Mediator</td><td>Centralizar a comunicação entre objetos, reduzindo dependências diretas.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Memento</td><td>Capturar e restaurar o estado interno de um objeto sem violar encapsulamento.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Visitor</td><td>Separar algoritmos dos objetos sobre os quais operam.</td></tr>
              <tr><td><span class="badge badge--b">Comportamental</span></td><td class="nome-padrao">Interpreter</td><td>Definir uma gramática e um interpretador para uma linguagem simples.</td></tr>
            </tbody>

          <p style="font-size:.9rem;margin-top:.3rem;">
            Em seguida, veja como alguns desses padrões aparecem em código na

        <!-- ── 5. QUANDO USAR ────────────────────────────────── -->
        <div class="card" id="quando-usar">
          <h2>5. Quando usar (ou não)</h2>

          <h3>Boas práticas gerais</h3>
          <p>Esta seção resume boas práticas ao decidir aplicar um padrão de projeto em seu código.</p>

          <h3>Use padrões quando…</h3>
          <u
          <ul>
            >O mesmo problema (ou algo muito parecido) aparece em diferentes partes do sistema.</l/li>
            >Você percebe que alterar uma parte obriga a alterar muitas outras (alto acoplamento).</l/li>
            >Precisa adicionar comportamentos sem reescrever classes existentes.</l/li>
            >A equipe precisa de uma linguagem comum para descrever a arquitetura.</li>
          </ul>

          <h3>Evite padrões quando…</h3>
          <u
          <ul>
            >O código é simples e funciona bem — adicionar um padrão aumentaria a complexidade sem ganho real.</l/li>
            >Você está aprendendo e ainda não identificou claramente o problema que o padrão resolve.</l/li>
            >A motivação é "parecer mais profissional" — padrões mal aplicados prejudicam legibilidade.</li>
          </ul>

          <div class="callout">
            <strong>Regra prática:</strong> primeiro faça funcionar, depois refatore identificando
            padrões. É mais natural reconhecer um padrão em código existente do que tentar
            aplicá-lo antes de entender o problema.
          </div>
          
        </div>

        <!-- ── 6. EXEMPLOS EM JS ─────────────────────────────── -->
        <div class="card" id="exemplos">
          <h2>6. Primeiros exemplos em JavaScript</h2>
          <p>
            Os exemplos abaixo são introdutórios, o objetivo é <em>ver a ideia</em> funcionando em código.
            Nesta aula, focamos em cinco padrões: <strong>Singleton</strong>, <strong>Observer</strong>,
            <strong>EventEmitter</strong>, <strong>Factory Method</strong> e <strong>Strategy</strong>.
          </p>

          <h3><span class="badge badge--c">Criacional</span> Singleton — instância única</h3>
          <p>Garante que exista apenas <em>um</em> objeto de determinada classe em todo o sistema.</p>

          <pre>de>// Padrão Singleton — uma única instância compartilhada
class ConfiguracaoApp {
  static #instancia = null;

  #configuracoes;

  constructor() {
    this.#configuracoes = {
      idioma: 'pt-BR',
      tema: 'claro',
      apiUrl: 'https://api.exemplo.com',
    };
  }

  static obterInstancia() {
    if (!ConfiguracaoApp.#instancia) {
      ConfiguracaoApp.#instancia = new ConfiguracaoApp();
    }
    return ConfiguracaoApp.#instancia;
  }

  obter(chave) {
    return this.#configuracoes[chave];
  }

  definir(chave, valor) {
    this.#configuracoes[chave] = valor;
  }
}

// Uso
const config1 = ConfiguracaoApp.obterInstancia();
const config2 = ConfiguracaoApp.obterInstancia();

config1.definir('tema', 'escuro');

console.log(config2.obter('tema'));        // 'escuro' — é o mesmo objeto
console.log(config1 === config2);         // true
</code></pre>

          <div class="anotacao">
            <dl>
              <dt>de>static #instancia = null</code></dt>
              <dd>Guarda a única instância como campo privado estático da própria classe, inacessível externamente.</dd>
              <dt>de>static obterInstancia()</code></dt>
              <dd>Ponto de acesso global: cria a instância na primeira chamada; nas seguintes, devolve a mesma que foi criada.</dd>
              <dt>Por que usar?</dt>
              <dd>Configurações, conexões com banco de dados, loggers — qualquer recurso que deve ser compartilhado e único em todo o sistema.</dd>
            </dl>
          </div>

          <h3><span class="badge badge--b">Comportamental</span> Observer — notificar sem acoplamento</h3>
          <p>
            Um objeto (sujeito) mantém uma lista de dependentes (observadores) e os notifica
            automaticamente quando seu estado muda.
          </p>

          <pre>de>// Padrão Observer — notificação desacoplada
class EventoCarrinho {
  #observadores = [];

  assinar(observador) {
    if (typeof observador.atualizar !== 'function') {
      throw new Error('Observador deve implementar o método atualizar().');
    }
    this.#observadores.push(observador);
  }

  cancelarAssinatura(observador) {
    this.#observadores = this.#observadores.filter(o => o !== observador);
  }

  notificar(dados) {
    this.#observadores.forEach(o => o.atualizar(dados));
  }
}

class Carrinho extends EventoCarrinho {
  #itens = [];

  adicionarItem(item) {
    this.#itens.push(item);
    this.notificar({ evento: 'item-adicionado', item, total: this.#itens.length });
  }
}

// Observadores concretos
const contadorUI = {
  atualizar({ total }) {
    console.log(`[UI] Carrinho atualizado: ${total} item(s).`);
  },
};

const logServidor = {
  atualizar({ evento, item }) {
    console.log(`[Log] Evento "${evento}" registrado para o item "${item}".`);
  },
};

// Uso
const carrinho = new Carrinho();
carrinho.assinar(contadorUI);
carrinho.assinar(logServidor);

carrinho.adicionarItem('Mouse sem fio');
// [UI]  Carrinho atualizado: 1 item(s).
// [Log] Evento "item-adicionado" registrado para o item "Mouse sem fio".
</code></pre>

          <div class="anotacao">
            <dl>
              <dt>de>assinar(observador)</code> / de>cancelarAssinatura(observador)</code></dt>
              <dd>Permitem que qualquer objeto interessado entre ou saia da lista de notificados — sem que o carrinho precise conhecer os detalhes de quem está ouvindo.</dd>
              <dt>de>notificar(dados)</code></dt>
              <dd>Percorre todos os observadores e chama de>atualizar()</code> em cada um, passando os dados do evento.</dd>
              <dt>Onde aparece no desenvolvimento web?</dt>
              <dd>Eventos do DOM (de>addEventListener</code>), stores de estado (Redux, Vuex), WebSockets, sistemas de notificação em tempo real — todos usam a ideia do Observer.</dd>
            </dl>
          </div>

          <h3><span class="badge badge--b">Comportamental</span> EventEmitter — eventos no estilo Node.js</h3>
          <p>
            Um de>EventEmitter</code> é uma implementação prática da ideia de Observer:
            você registra ouvintes para eventos identificados por nome e emite esses eventos
            passando dados para todos os ouvintes inscritos.[web:36]
          </p>

          <pre>de>// Implementação simples de EventEmitter em JavaScript
class EventEmitter {
  #eventos = {};

  on(evento, listener) {
    if (!this.#eventos[evento]) {
      this.#eventos[evento] = [];
    }
    this.#eventos[evento].push(listener);
  }

  off(evento, listener) {
    if (!this.#eventos[evento]) return;
    this.#eventos[evento] = this.#eventos[evento].filter(l => l !== listener);
  }

  emit(evento, dados) {
    if (!this.#eventos[evento]) return;
    this.#eventos[evento].forEach(listener => listener(dados));
  }
}

// Uso — simulando notificações em uma aplicação web
const notificacoes = new EventEmitter();

function mostrarToast(mensagem) {
  console.log('[TOAST]', mensagem);
}

function registrarLog(mensagem) {
  console.log('[LOG]', mensagem);
}

notificacoes.on('usuario:login', mostrarToast);
notificacoes.on('usuario:login', registrarLog);

notificacoes.emit('usuario:login', 'Usuário entrou no sistema');
// [TOAST] Usuário entrou no sistema
// [LOG]   Usuário entrou no sistema
</code></pre>

          <div class="anotacao">
            <dl>
              <dt>de>on(evento, listener)</code></dt>
              <dd>Registra uma função para ser chamada sempre que o evento com esse nome for emitido.</dd>
              <dt>de>emit(evento, dados)</code></dt>
              <dd>Dispara o evento e chama todos os <em>listeners</em> cadastrados, passando os dados necessários.</dd>
              <dt>Onde isso aparece?</dt>
              <dd>APIs do Node.js, bibliotecas de front-end e sistemas de eventos em geral usam alguma forma de de>EventEmitter</code> por baixo.[web:36]</dd>
            </dl>
          </div>

          <h3><span class="badge badge--c">Criacional</span> Factory Method — escolhendo o tipo certo</h3>
          <p>
            O <em>Factory Method</em> encapsula a lógica de criação de objetos em um único ponto,
            permitindo que você devolva diferentes implementações da mesma interface sem espalhar
            de>new</code> e de>if</code>/de>switch</code> pelo código.[web:2]
          </p>

          <pre>de>// Padrão Factory Method — escolhendo o tipo de notificador
class Notificador {
  enviar(mensagem) {
    throw new Error('Método enviar() deve ser implementado.');
  }
}

class NotificadorEmail extends Notificador {
  enviar(mensagem) {
    console.log(`Enviando e-mail: ${mensagem}`);
  }
}

class NotificadorSMS extends Notificador {
  enviar(mensagem) {
    console.log(`Enviando SMS: ${mensagem}`);
  }
}

class NotificadorPush extends Notificador {
  enviar(mensagem) {
    console.log(`Enviando notificação push: ${mensagem}`);
  }
}

// Creator com o Factory Method
class NotificadorFactory {
  static criar(tipo) {
    switch (tipo) {
      case 'email': return new NotificadorEmail();
      case 'sms':   return new NotificadorSMS();
      case 'push':  return new NotificadorPush();
      default:
        throw new Error(`Tipo de notificador desconhecido: ${tipo}`);
    }
  }
}

// Uso — o código cliente só conhece a interface Notificador
const notificador = NotificadorFactory.criar('email');
notificador.enviar('Bem-vindo à plataforma!');
</code></pre>

          <div class="anotacao">
            <dl>
              <dt>de>NotificadorFactory.criar(tipo)</code></dt>
              <dd>Centraliza a decisão de qual classe concreta instanciar, devolvendo sempre algo que se comporta como de>Notificador</code>.</dd>
              <dt>Por que isso ajuda?</dt>
              <dd>Se surgir um novo tipo de notificação (por exemplo, WhatsApp), você adiciona uma classe e ajusta a fábrica, sem mudar o código que consome o notificador.</dd>
            </dl>
          </div>

          <h3><span class="badge badge--b">Comportamental</span> Strategy — algoritmos intercambiáveis</h3>
          <p>
            Define uma família de algoritmos e permite trocá-los sem alterar o código que
            os utiliza.
          </p>

          <pre>de>// Padrão Strategy — forma de pagamento intercambiável
class ProcessadorPagamento {
  #estrategia;

  constructor(estrategia) {
    this.#estrategia = estrategia;
  }

  definirEstrategia(estrategia) {
    this.#estrategia = estrategia;
  }

  processar(valor) {
    return this.#estrategia.executar(valor);
  }
}

// Estratégias concretas
const pagamentoCartao = {
  executar(valor) {
    return `Pagamento de R$ ${valor.toFixed(2)} realizado via Cartão de Crédito.`;
  },
};

const pagamentoPix = {
  executar(valor) {
    return `Pagamento de R$ ${valor.toFixed(2)} realizado via Pix (instantâneo).`;
  },
};

const pagamentoBoleto = {
  executar(valor) {
    return `Boleto de R$ ${valor.toFixed(2)} gerado. Vencimento em 3 dias úteis.`;
  },
};

// Uso — troca de estratégia em tempo de execução
const processador = new ProcessadorPagamento(pagamentoPix);
console.log(processador.processar(150));

processador.definirEstrategia(pagamentoCartao);
console.log(processador.processar(150));
</code></pre>

          <div class="anotacao">
            <dl>
              <dt>de>this.#estrategia = estrategia</code></dt>
              <dd>O processador guarda uma referência à estratégia ativa, sem depender de qual classe concreta ela é.</dd>
              <dt>de>definirEstrategia()</code></dt>
              <dd>Permite trocar o comportamento em tempo de execução — sem condicional de>if/else</code> espalhado pelo código.</dd>
              <dt>Por que isso importa para web?</dt>
              <dd>Gateways de pagamento, validações de formulário, algoritmos de ordenação, formatação de respostas de API — todos são candidatos naturais ao Strategy.</dd>
            </dl>
          </div>
        </div>
